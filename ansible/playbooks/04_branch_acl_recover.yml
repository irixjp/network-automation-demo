---
- name: Evidence Repo - Prepare (clean clone)
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    git_ssh_command: >-
      sshpass -e ssh -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
  tasks:
    - name: Prepare evidence repository (clean clone)
      ansible.builtin.import_tasks: includes/git_evidence_prepare.yml

- name: Branch ACL - Policy switch
  hosts: branches
  gather_facts: no
  vars:
    site: "{{ inventory_hostname.split('-')[0] }}"
    guest_subnet: "{{ branch_vlan[site].guest.subnet }}"
  pre_tasks:
    - name: Require acl_file
      ansible.builtin.assert:
        that:
          - acl_file is defined
          - acl_file | length > 0
        fail_msg: "acl_file is required. Use -e acl_file=ansible/acl/acl_fileX.yml"

    - name: Load ACL definition
      ansible.builtin.include_vars:
        file: "{{ acl_file }}"

    - name: Assert ACL definition present
      ansible.builtin.assert:
        that:
          - acl is defined
          - acl.name is defined
          - acl.lines is defined
          - acl.apply_interfaces is defined
        fail_msg: "acl_file is missing required keys: acl.name/acl.lines/acl.apply_interfaces"

    - name: Debug ACL lines
      ansible.builtin.debug:
        var: acl.lines

  tasks:
    - name: Replace ACL with selected policy rules
      arista.eos.eos_config:
        before:
          - "no ip access-list {{ acl.name }}"
        parents: "ip access-list {{ acl.name }}"
        lines: "{{ acl.lines }}"
        match: none
        replace: block

    - name: Apply ACL outbound on WAN interfaces
      arista.eos.eos_config:
        lines:
          - "ip access-group {{ acl.name }} out"
        parents: "{{ item }}"
      loop: "{{ acl.apply_interfaces }}"

    - name: Show ACL after apply
      arista.eos.eos_command:
        commands:
          - "show running-config section ip access-list {{ acl.name }}"
      register: acl_after

    - name: Debug ACL apply result
      ansible.builtin.debug:
        msg:
          acl_name: "{{ acl.name }}"
          expected_line_count: "{{ acl.lines | length }}"
          running_config: "{{ acl_after.stdout[0] }}"

- name: Branch ACL - Evidence collection
  hosts: branches
  gather_facts: no
  tasks:
    - name: Run ACL evidence commands
      arista.eos.eos_command:
        commands: "{{ evidence_commands.routers }}"
      register: sh

    - name: Ensure evidence directory
      ansible.builtin.file:
        path: "{{ artifacts_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Save evidence output
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/{{ inventory_hostname }}/show.txt"
        content: |
          ## {{ inventory_hostname }}
          {% for c in sh.stdout %}
          ---
          {{ c }}
          {% endfor %}
      delegate_to: localhost

- name: Branch ACL - Push evidence to git
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    git_commit_ts: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
    git_commit_message: "{{ git_evidence.commit_prefix }}04_branch_acl_recover: {{ git_commit_ts }}"
    git_ssh_command: >-
      sshpass -e ssh -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
  tasks:
    - name: Push evidence repository (branch acl policy switch)
      ansible.builtin.import_tasks: includes/git_evidence_push.yml
