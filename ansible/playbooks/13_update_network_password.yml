---
- name: Evidence Repo - Prepare (clean clone)
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    git_ssh_command: >-
      sshpass -e ssh -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
  tasks:
    - name: Prepare evidence repository (clean clone)
      ansible.builtin.import_tasks: includes/git_evidence_prepare.yml

- name: Password Rotate - Validate input
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Require target_user
      ansible.builtin.assert:
        that:
          - target_user is defined
          - target_user in ['admin-main', 'admin-sub']
        fail_msg: "target_user must be 'admin-main' or 'admin-sub'"

    - name: Require generated_password
      ansible.builtin.assert:
        that:
          - generated_password is defined
          - generated_password | length > 0
        fail_msg: "generated_password is required (passed via set_stats or -e)"

- name: Password Rotate - Update password (Routers)
  hosts: eos_routers
  gather_facts: no
  tasks:
    - name: Set user password
      arista.eos.eos_config:
        lines:
          - "username {{ target_user }} privilege 15 secret 0 {{ generated_password }}"
      no_log: true

- name: Password Rotate - Update password (Switches)
  hosts: eos_switches
  gather_facts: no
  tasks:
    - name: Set user password
      arista.eos.eos_config:
        lines:
          - "username {{ target_user }} privilege 15 secret 0 {{ generated_password }}"
      no_log: true

- name: Password Rotate - Evidence collection (Routers)
  hosts: eos_routers
  gather_facts: no
  tasks:
    - name: Run show running-config sanitized
      arista.eos.eos_command:
        commands: "{{ evidence_commands.routers }}"
      register: sh

    - name: Ensure artifacts directory
      ansible.builtin.file:
        path: "{{ artifacts_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Save evidence output
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/{{ inventory_hostname }}/show.txt"
        content: |
          ## {{ inventory_hostname }}
          {% for c in sh.stdout %}
          ---
          {{ c }}
          {% endfor %}
      delegate_to: localhost

- name: Password Rotate - Evidence collection (Switches)
  hosts: eos_switches
  gather_facts: no
  tasks:
    - name: Run show running-config sanitized
      arista.eos.eos_command:
        commands: "{{ evidence_commands.switches }}"
      register: sh

    - name: Ensure artifacts directory
      ansible.builtin.file:
        path: "{{ artifacts_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Save evidence output
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/{{ inventory_hostname }}/show.txt"
        content: |
          ## {{ inventory_hostname }}
          {% for c in sh.stdout %}
          ---
          {{ c }}
          {% endfor %}
      delegate_to: localhost

- name: Password Rotate - Publish password for downstream
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Pass generated_password to next workflow node
      ansible.builtin.set_stats:
        data:
          generated_password: "{{ generated_password }}"

- name: Password Rotate - Push evidence to git
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    git_commit_ts: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
    git_commit_message: "{{ git_evidence.commit_prefix }}13_update_network_password ({{ target_user }}): {{ git_commit_ts }}"
    git_ssh_command: >-
      sshpass -e ssh -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
  tasks:
    - name: Push evidence repository (password rotate)
      ansible.builtin.import_tasks: includes/git_evidence_push.yml
