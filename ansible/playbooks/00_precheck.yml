---
- name: Precheck - Inventory sanity
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    expected_eos_routers: 13
    expected_eos_switches: 3
  tasks:
    - name: Assert inventory groups present
      ansible.builtin.assert:
        that:
          - "'eos_routers' in groups"
          - "'eos_switches' in groups"
          - "groups['eos_routers'] | length == expected_eos_routers"
          - "groups['eos_switches'] | length == expected_eos_switches"
        fail_msg: "Inventory group count mismatch."

    - name: Assert required connection vars present
      ansible.builtin.assert:
        that:
          - ansible_user is defined
          - ansible_password is defined
          - ansible_httpapi_port is defined
          - ansible_httpapi_use_ssl is defined
          - ansible_httpapi_validate_certs is defined
        fail_msg: "Required connection variables are missing."

- name: Precheck - EOS eAPI connectivity (Routers)
  hosts: eos_routers
  gather_facts: no
  tasks:
    - name: Run lightweight command
      arista.eos.eos_command:
        commands:
          - show hostname
      register: sh
      changed_when: false

    - name: Report hostname
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} => {{ sh.stdout[0] | default('no output') }}"

- name: Precheck - EOS eAPI connectivity (Switches)
  hosts: eos_switches
  gather_facts: no
  tasks:
    - name: Run lightweight command
      arista.eos.eos_command:
        commands:
          - show hostname
      register: sh
      changed_when: false

    - name: Report hostname
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} => {{ sh.stdout[0] | default('no output') }}"

- name: Precheck - Git server reachability (no push)
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    git_ssh_command: >-
      sshpass -e ssh -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
  tasks:
    - name: Check SSH authentication to git server
      ansible.builtin.command:
        cmd: "sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ git_evidence.ssh_user }}@172.20.20.200 true"
      changed_when: false
      environment:
        SSHPASS: "{{ git_evidence.ssh_password }}"

    - name: Check repository reachability
      ansible.builtin.command:
        cmd: "git ls-remote {{ git_evidence.repo_url }}"
      changed_when: false
      environment:
        SSHPASS: "{{ git_evidence.ssh_password }}"
        GIT_SSH_COMMAND: "{{ git_ssh_command }}"

- name: Precheck - Client reachability matrix (SSH)
  hosts: client_nodes
  gather_facts: no
  vars:
    matrix_targets: >-
      {{
        (groups['client_nodes'] | map('extract', hostvars, 'matrix_ip') | list)
        + (groups['srv_nodes'] | map('extract', hostvars, 'matrix_ip') | list)
      }}
    expected_failure_ips:
      - 10.30.1.10
      - 10.30.2.10
  tasks:
    - name: Run client/srv matrix pings
      ansible.builtin.raw: "ping -c 2 -W 1 {{ item }}"
      loop: "{{ matrix_targets }}"
      loop_control:
        label: "{{ inventory_hostname }} -> {{ item }}"
      when: item != matrix_ip
      register: matrix_ping_raw
      changed_when: false
      failed_when: false

    - name: Report matrix results
      ansible.builtin.debug:
        msg: >-
          Matrix ping failures: {{
            matrix_ping_raw.results
            | selectattr('rc', 'defined')
            | selectattr('rc', 'ne', 0)
            | map(attribute='item')
            | list
          }}

    - name: Report tolerated failures
      ansible.builtin.debug:
        msg: >-
          Tolerated failures: {{
            matrix_ping_raw.results
            | selectattr('rc', 'defined')
            | selectattr('rc', 'ne', 0)
            | selectattr('item', 'in', expected_failure_ips)
            | map(attribute='item')
            | list
          }}

    - name: Assert all matrix pings succeeded
      ansible.builtin.assert:
        that:
          - >-
            {{
              matrix_ping_raw.results
              | selectattr('rc', 'defined')
              | rejectattr('item', 'in', expected_failure_ips)
              | selectattr('rc', 'ne', 0)
              | list
              | length == 0
            }}
        fail_msg: "Client reachability matrix failed."
