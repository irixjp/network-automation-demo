- name: Remove existing evidence directory
  ansible.builtin.file:
    path: "{{ git_evidence.repo_dir }}"
    state: absent

- name: Clone evidence repository
  ansible.builtin.command:
    cmd: "git clone {{ git_evidence.repo_url }} {{ git_evidence.repo_dir }}"
  environment:
    SSHPASS: "{{ git_evidence.ssh_password }}"
    GIT_SSH_COMMAND: "{{ git_ssh_command }}"

- name: Checkout branch
  ansible.builtin.command:
    cmd: "git checkout -B {{ git_evidence.branch }}"
    chdir: "{{ git_evidence.repo_dir }}"
  environment:
    SSHPASS: "{{ git_evidence.ssh_password }}"
    GIT_SSH_COMMAND: "{{ git_ssh_command }}"

- name: Configure git identity
  ansible.builtin.command:
    cmd: "git config {{ item.key }} {{ item.value }}"
    chdir: "{{ git_evidence.repo_dir }}"
  loop:
    - { key: "user.name", value: "{{ git_evidence.user_name }}" }
    - { key: "user.email", value: "{{ git_evidence.user_email }}" }
  environment:
    SSHPASS: "{{ git_evidence.ssh_password }}"
    GIT_SSH_COMMAND: "{{ git_ssh_command }}"
