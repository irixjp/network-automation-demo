---
- name: Evidence Repo - Prepare (clean clone)
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    git_ssh_command: >-
      sshpass -e ssh -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
  tasks:
    - name: Prepare evidence repository (clean clone)
      ansible.builtin.import_tasks: includes/git_evidence_prepare.yml

- name: New App Segment - DC East/West leafs
  hosts: dce-leaf2:dcw-leaf2
  gather_facts: no
  vars:
    dc_site: "{{ inventory_hostname.split('-')[0] }}"
    leaf_intf: "{{ newapp[dc_site].intf }}"
    gw_ip: "{{ newapp[dc_site].gw }}"
    newapp_prefix: "{{ newapp[dc_site].prefix }}"
  tasks:
    - name: Configure leaf interface for new app subnet
      arista.eos.eos_config:
        lines:
          - "no shutdown"
          - "no switchport"
          - "ip address {{ gw_ip }}"
        parents: "interface {{ leaf_intf }}"
      register: newapp_leaf_cfg

    - name: Verify new app prefix on local leaf
      arista.eos.eos_command:
        commands:
          - "show ip route {{ newapp_prefix }}"
      register: newapp_leaf_route
      changed_when: false
      failed_when: "newapp_prefix not in (newapp_leaf_route.stdout[0] | default(''))"

    - name: Report leaf change result
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          prefix: "{{ newapp_prefix }}"
          changed: "{{ newapp_leaf_cfg.changed }}"
          route_output: "{{ newapp_leaf_route.stdout[0] }}"

- name: New App Segment - Fabric route verification
  hosts: dce-spine1:dce-spine2:dce-edge1:dcw-spine1:dcw-spine2:dcw-edge1
  gather_facts: no
  vars:
    site: "{{ inventory_hostname.split('-')[0] }}"
    expected_prefix: "{{ dc_route_checks[site].prefix }}"
  tasks:
    - name: Verify new app prefix learned in fabric
      arista.eos.eos_command:
        commands:
          - "show ip route {{ expected_prefix }}"
      register: fabric_route
      changed_when: false
      failed_when: "expected_prefix not in (fabric_route.stdout[0] | default(''))"

    - name: Report fabric route result
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          prefix: "{{ expected_prefix }}"
          route_output: "{{ fabric_route.stdout[0] }}"

- name: New App Segment - Branch reachability verification
  hosts: client_nodes
  gather_facts: no
  vars:
    newapp_targets:
      - "{{ dc_route_checks.dce.server_ip }}"
      - "{{ dc_route_checks.dcw.server_ip }}"
  tasks:
    - name: Ping new app servers from branch clients
      ansible.builtin.raw: "ping -c 2 -W 1 {{ item }}"
      loop: "{{ newapp_targets }}"
      loop_control:
        label: "{{ inventory_hostname }} -> {{ item }}"
      register: newapp_ping
      changed_when: false
      failed_when: false

    - name: Report branch reachability
      ansible.builtin.debug:
        msg: >-
          {{
            newapp_ping.results
            | map(attribute='stdout')
            | list
          }}

    - name: Assert new app reachability from branch clients
      ansible.builtin.assert:
        that:
          - >-
            {{
              newapp_ping.results
              | selectattr('rc', 'defined')
              | selectattr('rc', 'ne', 0)
              | list
              | length == 0
            }}
        fail_msg: "Branch client reachability to new app servers failed."

- name: New App Segment - Evidence collection
  hosts: dce-leaf2:dcw-leaf2:dce-spine1:dce-spine2:dce-edge1:dcw-spine1:dcw-spine2:dcw-edge1
  gather_facts: no
  vars:
    evidence_cmds: >-
      {{
        evidence_commands.dc_newapp_leafs
        if inventory_hostname in ['dce-leaf2', 'dcw-leaf2']
        else evidence_commands.dc_newapp_fabric
      }}
  tasks:
    - name: Run new app evidence commands
      arista.eos.eos_command:
        commands: "{{ evidence_cmds }}"
      register: sh
      changed_when: false

    - name: Ensure evidence directory
      ansible.builtin.file:
        path: "{{ artifacts_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Save evidence output
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/{{ inventory_hostname }}/show.txt"
        content: |
          ## {{ inventory_hostname }}
          {% for c in sh.stdout %}
          ---
          {{ c }}
          {% endfor %}
      delegate_to: localhost

- name: New App Segment - Push evidence to git
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    git_commit_ts: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
    git_commit_message: "{{ git_evidence.commit_prefix }}03_newapp_segment: {{ git_commit_ts }}"
    git_ssh_command: >-
      sshpass -e ssh -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
  tasks:
    - name: Push evidence repository (newapp)
      ansible.builtin.import_tasks: includes/git_evidence_push.yml
    - name: Post evidence diff to Redmine
      ansible.builtin.import_tasks: includes/git_evidence_diff_redmine.yml
