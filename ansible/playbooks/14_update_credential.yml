---
- name: Credential Update - Update AAP credential
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    credential_map:
      admin-main: admin-main-cred
      admin-sub: admin-sub-cred
  pre_tasks:
    - name: Require target_user
      ansible.builtin.assert:
        that:
          - target_user is defined
          - target_user in ['admin-main', 'admin-sub']
        fail_msg: "target_user must be 'admin-main' or 'admin-sub'"

    - name: Require generated_password
      ansible.builtin.assert:
        that:
          - generated_password is defined
          - generated_password | length > 0
        fail_msg: "generated_password is required (passed via set_stats or -e)"

  tasks:
    - name: Update AAP credential
      ansible.controller.credential:
        name: "{{ credential_map[target_user] }}"
        credential_type: "Machine"
        organization: "Default"
        inputs:
          username: "{{ target_user }}"
          password: "{{ generated_password }}"
        state: present
      no_log: true
