---
- name: Password Rotate - Generate password
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Generate random password
      ansible.builtin.set_fact:
        generated_password: "{{ lookup('community.general.random_string', length=16, override_special='!@#$%', min_lower=2, min_upper=2, min_numeric=2, min_special=1) }}"

    - name: Publish password to workflow
      ansible.builtin.set_stats:
        data:
          generated_password: "{{ generated_password }}"

    - name: Show generated password
      ansible.builtin.debug:
        msg: "Generated password for workflow: {{ generated_password }}"
