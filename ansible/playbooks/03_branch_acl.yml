---
- name: Evidence Repo - Prepare (clean clone)
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    git_ssh_command: >-
      ssh -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -i {{ git_evidence.ssh_key }}
  tasks:
    - name: Prepare evidence repository (clean clone)
      ansible.builtin.import_tasks: includes/git_evidence_prepare.yml

- name: Branch ACL - Guest isolation
  hosts: branches
  gather_facts: no
  vars:
    site: "{{ inventory_hostname.split('-')[0] }}"
    guest_vlan_id: "{{ branch_vlan.guest_vlan }}"
    guest_subnet: "{{ branch_vlan[site].guest.subnet }}"
    corp_subnet: "{{ branch_vlan[site].corp.subnet }}"
  tasks:
    - name: Ensure GUEST ACL for DC server protection
      arista.eos.eos_config:
        before:
          - "no ip access-list GUEST-TO-DC"
        lines:
          - "10 deny ip {{ guest_subnet }} 10.10.1.0/24"
          - "20 deny ip {{ guest_subnet }} 10.20.1.0/24"
          - "30 deny ip {{ guest_subnet }} 10.10.2.0/24"
          - "40 deny ip {{ guest_subnet }} 10.20.2.0/24"
          - "50 permit ip any any"
        parents: "ip access-list GUEST-TO-DC"

    - name: Apply ACL outbound on WAN interfaces
      arista.eos.eos_config:
        lines:
          - "ip access-group GUEST-TO-DC out"
        parents: "{{ item }}"
      loop:
        - interface Ethernet1
        - interface Ethernet2

- name: Branch ACL - Evidence collection
  hosts: branches
  gather_facts: no
  tasks:
    - name: Run ACL evidence commands
      arista.eos.eos_command:
        commands: "{{ evidence_commands.routers }}"
      register: sh

    - name: Ensure evidence directory
      ansible.builtin.file:
        path: "{{ artifacts_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Save evidence output
      ansible.builtin.copy:
        dest: "{{ artifacts_dir }}/{{ inventory_hostname }}/show.txt"
        content: |
          ## {{ inventory_hostname }}
          {% for c in sh.stdout %}
          ---
          {{ c }}
          {% endfor %}
      delegate_to: localhost

- name: Branch ACL - Push evidence to git
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    git_commit_ts: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
    git_commit_message: "{{ git_evidence.commit_prefix }}03_branch_acl: {{ git_commit_ts }}"
    git_ssh_command: >-
      ssh -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -i {{ git_evidence.ssh_key }}
  tasks:
    - name: Push evidence repository (branch acl)
      ansible.builtin.import_tasks: includes/git_evidence_push.yml
