all:
  vars:
    ansible_user: admin
    ansible_password: admin
    ansible_network_os: arista.eos.eos
    ansible_connection: ansible.netcommon.httpapi

    # EOS eAPI (HTTPS)
    ansible_httpapi_use_ssl: true
    ansible_httpapi_validate_certs: false
    ansible_httpapi_port: 443

    lab_name: ansible-enterprise-demo
    artifacts_dir: "{{ playbook_dir }}/../artifacts"

    git_evidence:
      repo_url: "ssh://git@172.20.20.200/srv/git/ansible-evidence.git"
      repo_dir: "{{ artifacts_dir }}"
      branch: "main"
      user_name: "ansible-demo"
      user_email: "ansible-demo@example.com"
      ssh_key: "{{ playbook_dir }}/../keys/git_demo"
      commit_prefix: ""
    client_ssh_user: "demo"
    client_ssh_password: "demo"

    # Evidence command sets (unified across scenarios)
    evidence_commands:
      routers:
        - show running-config sanitized
      switches:
        - show running-config sanitized

    # Audit + reachability demo
    audit_reachability:
      enabled: true
      delegate_host: "clab-host"
      probes:
        - name: "br1-client -> dce-corp-srv"
          src_node: "br1-client"
          dst: "10.10.1.10"
          count: 2
        - name: "br1-client -> dce-app-srv"
          src_node: "br1-client"
          dst: "10.20.1.10"
          count: 2
        - name: "br1-client -> dcw-corp-srv"
          src_node: "br1-client"
          dst: "10.10.2.10"
          count: 2
        - name: "br1-client -> dcw-app-srv"
          src_node: "br1-client"
          dst: "10.20.2.10"
          count: 2

    # 新アプリ用セグメント（leaf2 の Ethernet4 を使う想定）
    newapp:
      dce:
        leaf: dce-leaf2
        intf: Ethernet4
        gw: 10.30.1.1/24
        server_ip: 10.30.1.10
        client_probe: br1-client
      dcw:
        leaf: dcw-leaf2
        intf: Ethernet4
        gw: 10.30.2.1/24
        server_ip: 10.30.2.10
        client_probe: br1-client

    # ルートリークデモ（既存）
    leak_prefix: "203.0.113.0/24"

    # VLANデモ（支店）
    branch_vlan:
      corp_vlan: 10
      guest_vlan: 20
      br1:
        corp:
          ip: "10.10.101.10/24"
          gw: "10.10.101.1"
          subnet: "10.10.101.0/24"
        guest:
          ip: "10.110.101.10/24"
          gw: "10.110.101.1"
          subnet: "10.110.101.0/24"
      br2:
        corp:
          ip: "10.10.102.10/24"
          gw: "10.10.102.1"
          subnet: "10.10.102.0/24"
        guest:
          ip: "10.110.102.10/24"
          gw: "10.110.102.1"
          subnet: "10.110.102.0/24"
      br3:
        corp:
          ip: "10.10.103.10/24"
          gw: "10.10.103.1"
          subnet: "10.10.103.0/24"
        guest:
          ip: "10.110.103.10/24"
          gw: "10.110.103.1"
          subnet: "10.110.103.0/24"

    # VLAN拡張デモ（支店）
    branch_vlan_expansion:
      corp_vlan: 30
      corp_name: CORP-EXT
      guest_vlan: 40
      guest_name: GUEST-EXT
      br1:
        corp:
          gw: "10.10.201.1"
          subnet: "10.10.201.0/24"
        guest:
          gw: "10.110.201.1"
          subnet: "10.110.201.0/24"
      br2:
        corp:
          gw: "10.10.202.1"
          subnet: "10.10.202.0/24"
        guest:
          gw: "10.110.202.1"
          subnet: "10.110.202.0/24"
      br3:
        corp:
          gw: "10.10.203.1"
          subnet: "10.10.203.0/24"
        guest:
          gw: "10.110.203.1"
          subnet: "10.110.203.0/24"

  children:
    eos_routers:
      vars:
        ansible_become: true
        ansible_become_method: enable
        ansible_become_password: "{{ ansible_password }}"
      children:
        dce_spines:
          hosts:
            dce-spine1: { ansible_host: 172.20.20.11 }
            dce-spine2: { ansible_host: 172.20.20.12 }

        dce_leafs:
          hosts:
            dce-leaf1:  { ansible_host: 172.20.20.13 }
            dce-leaf2:  { ansible_host: 172.20.20.14 }

        dce_edges:
          hosts:
            dce-edge1:  { ansible_host: 172.20.20.15 }

        dcw_spines:
          hosts:
            dcw-spine1: { ansible_host: 172.20.20.21 }
            dcw-spine2: { ansible_host: 172.20.20.22 }

        dcw_leafs:
          hosts:
            dcw-leaf1:  { ansible_host: 172.20.20.23 }
            dcw-leaf2:  { ansible_host: 172.20.20.24 }

        dcw_edges:
          hosts:
            dcw-edge1:  { ansible_host: 172.20.20.25 }

        branches:
          hosts:
            br1-rtr: { ansible_host: 172.20.20.31 }
            br2-rtr: { ansible_host: 172.20.20.32 }
            br3-rtr: { ansible_host: 172.20.20.33 }

    eos_switches:
      vars:
        ansible_become: true
        ansible_become_method: enable
        ansible_become_password: "{{ ansible_password }}"
      hosts:
        br1-sw: { ansible_host: 172.20.20.131 }
        br2-sw: { ansible_host: 172.20.20.132 }
        br3-sw: { ansible_host: 172.20.20.133 }

    clab_hosts:
      vars:
        ansible_host: 192.168.33.10
        ansible_user: vagrant
        ansible_ssh_private_key_file: /Users/tnakajim/Dropbox/home/src/vagrant/containerlab/.vagrant/machines/default/virtualbox/private_key
        ansible_connection: ssh
        ansible_network_os: ""
        ansible_password: ""
        ansible_become: true
        ansible_become_method: sudo
        ansible_become_user: root
        ansible_become_password: ""
      hosts:
        clab-host:

    client_nodes:
      vars:
        ansible_connection: ssh
        ansible_user: "{{ client_ssh_user }}"
        ansible_password: "{{ client_ssh_password }}"
        ansible_network_os: ""
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      hosts:
        br1-client: { ansible_host: 172.20.20.121, matrix_ip: 10.10.101.10 }
        br1-guest-client: { ansible_host: 172.20.20.124, matrix_ip: 10.110.101.10 }
        br2-client: { ansible_host: 172.20.20.122, matrix_ip: 10.10.102.10 }
        br3-client: { ansible_host: 172.20.20.123, matrix_ip: 10.10.103.10 }

    srv_nodes:
      vars:
        ansible_connection: ssh
        ansible_user: "{{ client_ssh_user }}"
        ansible_password: "{{ client_ssh_password }}"
        ansible_network_os: ""
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      hosts:
        dce-corp-srv: { ansible_host: 172.20.20.101, matrix_ip: 10.10.1.10 }
        dce-app-srv: { ansible_host: 172.20.20.102, matrix_ip: 10.20.1.10 }
        dce-newapp-srv: { ansible_host: 172.20.20.103, matrix_ip: 10.30.1.10 }
        dcw-corp-srv: { ansible_host: 172.20.20.111, matrix_ip: 10.10.2.10 }
        dcw-app-srv: { ansible_host: 172.20.20.112, matrix_ip: 10.20.2.10 }
        dcw-newapp-srv: { ansible_host: 172.20.20.113, matrix_ip: 10.30.2.10 }
