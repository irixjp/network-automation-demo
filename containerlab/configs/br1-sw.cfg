hostname br1-sw
!
username admin privilege 15 secret admin
!
service routing protocols model multi-agent
!
interface Management0
   ip address 172.20.20.131/24
   no shutdown
!
ip routing
ip route 0.0.0.0/0 172.20.20.1
!
management api http-commands
   protocol https
   no shutdown
!
vlan 10
   name CORP
!
vlan 20
   name GUEST
!
interface Ethernet1
   description br1-client (ACCESS VLAN10)
   switchport
   switchport mode access
   switchport access vlan 10
   spanning-tree portfast
   no shutdown
!
interface Ethernet2
   description br1-rtr (TRUNK VLAN10,20)
   switchport
   switchport mode trunk
   switchport trunk allowed vlan 10,20
   no shutdown
!
interface Ethernet4
   description br1-deadman (GUEST OBSERVER VLAN20)
   switchport
   switchport mode access
   switchport access vlan 20
   spanning-tree portfast
   no shutdown
!
end
