hostname dcw-spine1
!
username admin privilege 15 secret admin
!
service routing protocols model multi-agent
!
interface Management0
   ip address 172.20.20.21/24
   no shutdown
!
ip routing
!
ip name-server 8.8.8.8
ntp server 172.20.20.1
!
management api http-commands
   protocol https
   no shutdown
!
interface Loopback0
   ip address 10.255.0.21/32
!
interface Ethernet1
   no switchport
   ip address 10.0.1.0/31
   no shutdown
!
interface Ethernet2
   no switchport
   ip address 10.0.1.2/31
   no shutdown
!
interface Ethernet3
   no switchport
   ip address 10.0.1.8/31
   no shutdown
!
router bgp 65200
   router-id 10.255.0.21
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
!
router bgp 65200
   neighbor 10.0.1.1 peer group UNDERLAY
   neighbor 10.0.1.1 remote-as 65201
router bgp 65200
   neighbor 10.0.1.3 peer group UNDERLAY
   neighbor 10.0.1.3 remote-as 65201
router bgp 65200
   neighbor 10.0.1.9 peer group UNDERLAY
   neighbor 10.0.1.9 remote-as 65210
router bgp 65200
   address-family ipv4
      network 10.255.0.21/32
      redistribute connected
      neighbor UNDERLAY activate
      neighbor 10.0.1.1 activate
      neighbor 10.0.1.3 activate
      neighbor 10.0.1.9 activate
   !
!
ip route 0.0.0.0/0 172.20.20.1
!
end
