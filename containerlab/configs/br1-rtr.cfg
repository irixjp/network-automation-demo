hostname br1-rtr
!
username admin privilege 15 secret admin
!
service routing protocols model multi-agent
!
interface Management0
   ip address 172.20.20.31/24
   no shutdown
!
ip routing
!
ip name-server 8.8.8.8
ntp server 172.20.20.1
!
management api http-commands
   protocol https
   no shutdown
!
interface Loopback0
   ip address 10.255.0.31/32
!
interface Ethernet1
   no switchport
   ip address 10.255.1.0/31
   ip access-group GUEST-TO-DC out
   no shutdown
!
interface Ethernet2
   no switchport
   ip address 10.255.1.2/31
   ip access-group GUEST-TO-DC out
   no shutdown
!
interface Ethernet3
   no switchport
   no shutdown
!
interface Ethernet3.10
   encapsulation dot1q vlan 10
   ip address 10.10.101.1/24
!
interface Ethernet3.20
   encapsulation dot1q vlan 20
   ip address 10.110.101.1/24
!
router bgp 65301
   router-id 10.255.0.31
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
!
router bgp 65301
   neighbor 10.255.1.1 peer group UNDERLAY
   neighbor 10.255.1.1 remote-as 65000
router bgp 65301
   neighbor 10.255.1.3 peer group UNDERLAY
   neighbor 10.255.1.3 remote-as 65000
router bgp 65301
   address-family ipv4
      network 10.255.0.31/32
      redistribute connected
      neighbor UNDERLAY activate
      neighbor 10.255.1.1 activate
      neighbor 10.255.1.3 activate
   !
!
ip access-list GUEST-TO-DC
   10 deny ip 10.110.101.0/24 10.30.1.0/24
   20 deny ip 10.110.101.0/24 10.30.2.0/24
   30 permit ip any any
!
ip route 0.0.0.0/0 172.20.20.1
!
end
