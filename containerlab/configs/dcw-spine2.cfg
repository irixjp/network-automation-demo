hostname dcw-spine2
!
username admin privilege 15 secret admin
username admin-main privilege 15 secret admin-main
username admin-sub privilege 15 secret admin-sub
!
service routing protocols model multi-agent
!
interface Management0
   ip address 172.20.20.22/24
   no shutdown
!
ip routing
!
ip name-server 8.8.8.8
ntp server 172.20.20.1
!
management api http-commands
   protocol https
   no shutdown
!
interface Loopback0
   ip address 10.255.0.22/32
!
interface Ethernet1
   no switchport
   ip address 10.0.1.4/31
   no shutdown
!
interface Ethernet2
   no switchport
   ip address 10.0.1.6/31
   no shutdown
!
interface Ethernet3
   no switchport
   ip address 10.0.1.10/31
   no shutdown
!
router bgp 65200
   router-id 10.255.0.22
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
!
router bgp 65200
   neighbor 10.0.1.5 peer group UNDERLAY
   neighbor 10.0.1.5 remote-as 65201
router bgp 65200
   neighbor 10.0.1.7 peer group UNDERLAY
   neighbor 10.0.1.7 remote-as 65201
router bgp 65200
   neighbor 10.0.1.11 peer group UNDERLAY
   neighbor 10.0.1.11 remote-as 65210
router bgp 65200
   address-family ipv4
      network 10.255.0.22/32
      redistribute connected
      neighbor UNDERLAY activate
      neighbor 10.0.1.5 activate
      neighbor 10.0.1.7 activate
      neighbor 10.0.1.11 activate
   !
!
ip route 0.0.0.0/0 172.20.20.1
!
end
