hostname dce-edge1
!
username admin privilege 15 secret admin
username admin-main privilege 15 secret admin-main
username admin-sub privilege 15 secret admin-sub
!
service routing protocols model multi-agent
!
interface Management0
   ip address 172.20.20.15/24
   no shutdown
!
ip routing
!
ip name-server 8.8.8.8
ntp server 172.20.20.1
!
management api http-commands
   protocol https
   no shutdown
!
interface Loopback0
   ip address 10.255.0.15/32
!
interface Ethernet1
   no switchport
   ip address 10.0.0.9/31
   no shutdown
!
interface Ethernet2
   no switchport
   ip address 10.0.0.11/31
   no shutdown
!
interface Ethernet3
   no switchport
   ip address 10.255.0.0/31
   no shutdown
!
interface Ethernet4
   no switchport
   ip address 10.255.0.2/31
   no shutdown
!
router bgp 65110
   router-id 10.255.0.15
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
!
router bgp 65110
   neighbor 10.0.0.8 peer group UNDERLAY
   neighbor 10.0.0.8 remote-as 65100
router bgp 65110
   neighbor 10.0.0.10 peer group UNDERLAY
   neighbor 10.0.0.10 remote-as 65100
router bgp 65110
   neighbor 10.255.0.1 peer group UNDERLAY
   neighbor 10.255.0.1 remote-as 65000
router bgp 65110
   neighbor 10.255.0.3 peer group UNDERLAY
   neighbor 10.255.0.3 remote-as 65000
router bgp 65110
   address-family ipv4
      network 10.255.0.15/32
      redistribute connected
      neighbor UNDERLAY activate
      neighbor 10.0.0.8 activate
      neighbor 10.0.0.10 activate
      neighbor 10.255.0.1 activate
      neighbor 10.255.0.3 activate
   !
!
ip route 0.0.0.0/0 172.20.20.1
!
end
