hostname br3-rtr
!
username admin privilege 15 secret admin
username admin-main privilege 15 secret admin-main
username admin-sub privilege 15 secret admin-sub
!
service routing protocols model multi-agent
!
interface Management0
   ip address 172.20.20.33/24
   no shutdown
!
ip routing
!
ip name-server 8.8.8.8
ntp server 172.20.20.1
!
management api http-commands
   protocol https
   no shutdown
!
interface Loopback0
   ip address 10.255.0.33/32
!
interface Ethernet1
   no switchport
   ip address 10.255.1.8/31
   no shutdown
!
interface Ethernet2
   no switchport
   ip address 10.255.1.10/31
   no shutdown
!
interface Ethernet3
   no switchport
   no shutdown
!
interface Ethernet3.10
   encapsulation dot1q vlan 10
   ip address 10.10.103.1/24
!
interface Ethernet3.20
   encapsulation dot1q vlan 20
   ip address 10.110.103.1/24
   ip access-group GUEST-TO-DC in
!
router bgp 65303
   router-id 10.255.0.33
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
!
router bgp 65303
   neighbor 10.255.1.9 peer group UNDERLAY
   neighbor 10.255.1.9 remote-as 65000
router bgp 65303
   neighbor 10.255.1.11 peer group UNDERLAY
   neighbor 10.255.1.11 remote-as 65000
router bgp 65303
   address-family ipv4
      network 10.255.0.33/32
      redistribute connected
      neighbor UNDERLAY activate
      neighbor 10.255.1.9 activate
      neighbor 10.255.1.11 activate
   !
!
ip access-list GUEST-TO-DC
   10 permit ip 10.110.103.0/24 10.10.1.0/24
   20 permit ip 10.110.103.0/24 10.20.1.0/24
   30 permit ip 10.110.103.0/24 10.10.2.0/24
   40 permit ip 10.110.103.0/24 10.20.2.0/24
   50 permit ip 10.110.103.0/24 10.10.101.0/24
   60 permit ip 10.110.103.0/24 10.10.102.0/24
   70 permit ip 10.110.103.0/24 10.10.103.0/24
   90 deny ip any any
!
ip route 0.0.0.0/0 172.20.20.1
!
end
