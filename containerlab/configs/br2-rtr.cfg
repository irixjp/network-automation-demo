hostname br2-rtr
!
username admin privilege 15 secret admin
!
service routing protocols model multi-agent
!
interface Management0
   ip address 172.20.20.32/24
   no shutdown
!
ip routing
!
ip name-server 8.8.8.8
ntp server 172.20.20.1
!
management api http-commands
   protocol https
   no shutdown
!
interface Loopback0
   ip address 10.255.0.32/32
!
interface Ethernet1
   no switchport
   ip address 10.255.1.4/31
   no shutdown
!
interface Ethernet2
   no switchport
   ip address 10.255.1.6/31
   no shutdown
!
interface Ethernet3
   no switchport
   no shutdown
!
interface Ethernet3.10
   encapsulation dot1q vlan 10
   ip address 10.10.102.1/24
!
interface Ethernet3.20
   encapsulation dot1q vlan 20
   ip address 10.110.102.1/24
!
router bgp 65302
   router-id 10.255.0.32
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
!
router bgp 65302
   neighbor 10.255.1.5 peer group UNDERLAY
   neighbor 10.255.1.5 remote-as 65000
router bgp 65302
   neighbor 10.255.1.7 peer group UNDERLAY
   neighbor 10.255.1.7 remote-as 65000
router bgp 65302
   address-family ipv4
      network 10.255.0.32/32
      redistribute connected
      neighbor UNDERLAY activate
      neighbor 10.255.1.5 activate
      neighbor 10.255.1.7 activate
   !
!
ip route 0.0.0.0/0 172.20.20.1
!
end
