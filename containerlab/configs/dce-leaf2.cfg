hostname dce-leaf2
!
username admin privilege 15 secret admin
username admin-main privilege 15 secret admin-main
username admin-sub privilege 15 secret admin-sub
!
service routing protocols model multi-agent
!
interface Management0
   ip address 172.20.20.14/24
   no shutdown
!
ip routing
!
ip name-server 8.8.8.8
ntp server 172.20.20.1
!
management api http-commands
   protocol https
   no shutdown
!
interface Loopback0
   ip address 10.255.0.14/32
!
interface Ethernet1
   no switchport
   ip address 10.0.0.3/31
   no shutdown
!
interface Ethernet2
   no switchport
   ip address 10.0.0.7/31
   no shutdown
!
interface Ethernet3
   no switchport
   ip address 10.20.1.1/24
   no shutdown
!
interface Ethernet4
   shutdown
!
router bgp 65101
   router-id 10.255.0.14
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
!
router bgp 65101
   neighbor 10.0.0.2 peer group UNDERLAY
   neighbor 10.0.0.2 remote-as 65100
router bgp 65101
   neighbor 10.0.0.6 peer group UNDERLAY
   neighbor 10.0.0.6 remote-as 65100
router bgp 65101
   address-family ipv4
      network 10.255.0.14/32
      redistribute connected
      neighbor UNDERLAY activate
      neighbor 10.0.0.2 activate
      neighbor 10.0.0.6 activate
   !
!
ip route 0.0.0.0/0 172.20.20.1
!
end
